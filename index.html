<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>NFT Preview Card</title>
        <link rel="stylesheet" href="./style.css">

    </head>
    <body>

<!-- //main NFT card container// -->
     <main class="card">
<!-- //image wrapper -->
     
            <!-- // add nft image  -->
            
<div class="card__images">
    <img
        src="../assets/image-equilibrium.jpg"
        alt="Equilibrium NFT artwork"
        class="nft-image"
    />

    <div class="card__images-layer">
        <img src="../assets/icon-view.svg" alt="" />
    </div>
</div>

                
        

 <!-- //title nft -->
                    <div class="card__title">
                        <h1>Equilibrium #3429</h1>
                    </div>
                    
<!-- //discription// -->
                    <p id="info">Our Equilibrium collection promotes balance and calm.</p>

                            <div class="card__time">
                                <div class="card__time-left">
                                    <img src="../assets/icon-ethereum.svg" alt="" />
                                    <p><span>0.041 ETH</span></p>
                                </div>
                            
                                <div class="card__time-right">
                                    <img src="../assets/icon-clock.svg" alt="" />
                                    <p><span>3 days left</span></p>
                                </div>
                            </div>

<!-- //for creator information -->
                                    <div class="card__creator">
                                        <div class="creator-image">
                                            <img src="../assets/image-avatar.png" alt="avatar"/>
                                        </div>
                                        <p>Creation of <span> Ketan Makode </span></p>
                                    </div>

<!-- //adding footer for links and content  -->
     
     </main>
     <footer class="attribution">
        Challenge by
        <a href="https://www.crio.do"
           target="_blank"
           rel="noopener">
            Crio.Do
        </a>.
    
        Coded by
        <a href="https://www.github.com/Divya173-svg"
           target="_blank"
           rel="noopener">
            GitHub
        </a>.
    </footer>
    </body>
</html>
